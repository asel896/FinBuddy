version: '3.8'

services:
  db:
    image: postgres:16
    container_name: finbuddy_db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: finbuddy
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build: ./backend
    container_name: finbuddy_api
    ports:
      - "8000:8000"
    env_file:        
      - .env  
    environment:
      - DATABASE_URL=postgresql://postgres:password@db:5432/finbuddy
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    depends_on:
      - db

volumes:
  postgres_data:







          
   